[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Customer churn prediction with Flask web app"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flask>=3.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "imbalanced-learn>=0.11.0",
]

[tool.vercel]
entrypoint = "run:app"
