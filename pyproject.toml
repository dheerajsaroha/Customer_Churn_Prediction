[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Customer churn prediction with ML pipeline and Flask web app"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "flask>=3.0.0",
    "pytest>=7.0.0",
]

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.python]
requirements = "requirements.txt"
