{% extends "base.html" %}
{% block title %}Predict - Customer Churn{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-form fa me-2"></i>Enter Customer Details</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.predict') }}" id="prediction-form">
                    {% for col in feature_names %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ col.replace('_', ' ').title() }}</label>
                        {% if feature_options[col] == "number" %}
                        <input type="number" step="any" name="{{ col }}" class="form-control" required>
                        {% else %}
                        <select name="{{ col }}" class="form-select" required>
                            {% for opt in feature_options[col] %}
                            <option value="{{ opt }}" {% if loop.first %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-bolt me-2"></i>Predict Churn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
